repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: annotations
        name: annotation policy
        entry: python scripts/check_annotations.py
        language: system
        pass_filenames: false
      - id: public-docstrings
        name: public boundary docstrings
        entry: python scripts/check_docstrings.py
        language: system
        pass_filenames: false

[metadata]
name = eventful
version = 0.1.0
author = Eventful Team
author_email = team@eventful.org
description = A universal event-bus / pub-sub system for micro-service communication
long_description = file: README.md
long_description_content_type = text/markdown
keywords = events, pubsub, message-bus, microservices
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.13
    Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = find:
python_requires = >=3.13
install_requires =

[options.packages.find]
where = .
include = eventful*

[options.extras_require]
redis = redis>=5.0
postgres = asyncpg>=0.29
file = orjson>=3.9
fastapi = fastapi>=0.110, anyio>=4.0
starlette = starlette>=0.37
ratelimit = anyio>=4.0
anyio = anyio>=4.0
pydantic = pydantic>=2.5
dev =
    pytest>=7.0,
    pytest-asyncio>=0.21,
    pytest-cov>=4.0,
    hypothesis>=6.0,
    black>=23.0,
    ruff>=0.1,
    mypy>=1.0,
    pre-commit>=3.0

[options.entry_points]
eventful.plugins =
    redis = eventful.transports.redis_bus:RedisBus
    file = eventful.persistence.file_persistence:FilePersistence
    postgres = eventful.persistence.postgres_persistence:PostgresPersistence

[easyinstall]
zip_ok = False

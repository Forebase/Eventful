[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventful"
dynamic = ["version"]
description = "Typed event dispatch, transport, and persistence building blocks for Python applications"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
authors = [{name = "Eventful maintainers", email = "team@eventful.org"}]
keywords = ["events", "pubsub", "event-bus", "dispatch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Forebase/Eventful"
Documentation = "https://github.com/Forebase/Eventful/tree/main/docs"
Issues = "https://github.com/Forebase/Eventful/issues"
Changelog = "https://github.com/Forebase/Eventful/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis>=8.1.0,<9"]
postgres = ["asyncpg>=0.31.0,<1"]
file = []  # Dependency-free UTF-8 JSON Lines persistence backend.
fastapi = ["fastapi>=0.141.1,<1"]
starlette = ["starlette>=1.6.0,<2"]
test = ["asyncpg>=0.31.0", "build>=1.6.0", "fastapi>=0.141.1", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", "redis>=8.1.0", "starlette>=1.6.0"]
docs = ["mkdocs>=1.6.1"]
dev = ["asyncpg>=0.31.0", "build>=1.6.0", "fastapi>=0.141.1", "mkdocs>=1.6.1", "mypy>=2.3.1", "pre-commit>=4.6.2", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", "redis>=8.1.0", "ruff>=0.16.6", "starlette>=1.6.0"]
all = ["asyncpg>=0.31.0", "fastapi>=0.141.1", "redis>=8.1.0", "starlette>=1.6.0"]

[tool.setuptools.dynamic]
version = {attr = "eventful.__version__.__version__"}
[tool.setuptools.packages.find]
where = ["src"]
include = ["eventful*"]
[tool.setuptools.package-data]
eventful = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E741", "E731", "F401", "F403"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["eventful"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --tb=short -ra"
asyncio_mode = "auto"
filterwarnings = ["error", "ignore:.*deprecated.*:DeprecationWarning"]
markers = [
  "postgres_integration: requires PostgreSQL configured by EVENTFUL_POSTGRES_URL",
  "redis_integration: requires Redis configured by EVENTFUL_REDIS_URL",
]

[[tool.mypy.overrides]]
module = [
  "eventful.adapters.starlette",
  "eventful.utilities.debounce",
  "eventful.utilities.logging_handler",
  "eventful.utilities.rate_limit",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "eventful.contracts"
ignore_errors = false
strict = true

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventful"
dynamic = ["version"]
description = "Provisional event dispatch contracts and local in-memory event bus for Python applications"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
authors = [{name = "Eventful maintainers", email = "team@eventful.org"}]
keywords = ["events", "pubsub", "event-bus", "dispatch"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5"]
postgres = ["asyncpg>=0.29"]
file = []
fastapi = ["fastapi>=0.110"]
starlette = ["starlette>=0.37"]
test = ["build>=1.2", "pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5"]
docs = ["mkdocs>=1.6"]
dev = ["build>=1.2", "mypy>=1.10", "pre-commit>=3.7", "pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5"]
all = ["asyncpg>=0.29", "fastapi>=0.110", "redis>=5", "starlette>=0.37"]

[tool.setuptools.dynamic]
version = {attr = "eventful.__version__.__version__"}
[tool.setuptools.packages.find]
where = ["src"]
include = ["eventful*"]
[tool.setuptools.package-data]
eventful = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E741", "E731", "F401", "F403"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["eventful"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --tb=short -ra"
asyncio_mode = "auto"
filterwarnings = ["error", "ignore:.*deprecated.*:DeprecationWarning"]

[[tool.mypy.overrides]]
module = "eventful.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "eventful.contracts"
ignore_errors = false
strict = true

name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EVENTFUL_REDIS_URL: redis://localhost:6379/15
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_quality.py
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import eventful; import eventful.contracts"
      - run: python -c "import eventful.transports.redis; import eventful.persistence.postgres_persistence"

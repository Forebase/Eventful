name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Forebase/Eventful'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - name: Require tag and package versions to match
        shell: bash
        run: |
          package_version=$(python -c 'exec(open("src/eventful/__version__.py").read()); print(__version__)')
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/eventful/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
